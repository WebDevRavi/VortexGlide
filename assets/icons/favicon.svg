<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f1430"/>
      <stop offset="100%" stop-color="#04060d"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" stroke="#00f3ff" stroke-width="6" stroke-opacity="0.4"/>

  <!-- Tunnel Perspective Rings -->
  <polygon points="256,40 430,140 472,340 360,472 152,472 40,340 82,140" fill="none" stroke="#00f3ff" stroke-width="4" stroke-opacity="0.3"/>
  <polygon points="256,100 378,170 408,310 328,402 184,402 104,310 134,170" fill="none" stroke="#00f3ff" stroke-width="6" stroke-opacity="0.6"/>
  <polygon points="256,160 326,200 344,280 298,332 214,332 168,280 186,200" fill="none" stroke="#ff007b" stroke-width="8" filter="url(#glow)"/>

  <!-- Center Glowing Craft -->
  <g transform="translate(256, 310)" filter="url(#glow)">
    <!-- Wings -->
    <path d="M 0,-40 L -75,25 L -20,10 L 0,35 L 20,10 L 75,25 Z" fill="url(#neonCyan)"/>
    <!-- Cockpit Core -->
    <ellipse cx="0" cy="-5" rx="8" ry="18" fill="#ffffff"/>
  </g>
</svg>
